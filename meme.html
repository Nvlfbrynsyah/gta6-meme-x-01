<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WANTED: GTA VI</title>
<style>
  html, body { margin: 0; width: 1200px; height: 675px; overflow: hidden; background: #8f7c58; }
  body { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif; }
  svg { display: block; }
  .sans { font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Leonida Police Department wanted poster for GTA VI: six gold stars, a 500 dollar reward paid by an AI agent's make.fun bounty.">
  <defs>
    <radialGradient id="paper" cx="0.42" cy="0.32" r="0.92">
      <stop offset="0" stop-color="#f8f0da"/>
      <stop offset="0.6" stop-color="#efe2c0"/>
      <stop offset="1" stop-color="#dcc79a"/>
    </radialGradient>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98c"/>
      <stop offset="0.5" stop-color="#f6c628"/>
      <stop offset="1" stop-color="#cd9108"/>
    </linearGradient>
    <linearGradient id="bandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d42020"/>
      <stop offset="0.6" stop-color="#b41212"/>
      <stop offset="1" stop-color="#8e0b0b"/>
    </linearGradient>
    <linearGradient id="mugG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cec09e"/>
      <stop offset="1" stop-color="#a99a76"/>
    </linearGradient>
    <pattern id="stain" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="34" r="9" fill="#7a5a1e" opacity="0.06"/>
      <circle cx="30" cy="34" r="4" fill="#7a5a1e" opacity="0.08"/>
      <circle cx="96" cy="102" r="13" fill="#7a5a1e" opacity="0.045"/>
      <circle cx="70" cy="20" r="5" fill="#5a3d12" opacity="0.05"/>
      <circle cx="112" cy="72" r="7" fill="#7a5a1e" opacity="0.04"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="starShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- aged paper -->
  <rect x="0" y="0" width="1200" height="675" fill="#8f7c58"/>
  <rect x="16" y="16" width="1168" height="643" fill="url(#paper)" filter="url(#grain)"/>
  <rect x="16" y="16" width="1168" height="643" fill="url(#stain)"/>
  <ellipse cx="1085" cy="72" rx="88" ry="58" fill="#9c7c3e" opacity="0.13"/>
  <ellipse cx="118" cy="604" rx="118" ry="66" fill="#9c7c3e" opacity="0.10"/>

  <!-- border -->
  <rect x="16.5" y="16.5" width="1167" height="642" fill="none" stroke="#1c1710" stroke-width="3"/>
  <rect x="32" y="34" width="1136" height="607" fill="none" stroke="#1c1710" stroke-width="1.6" opacity="0.85"/>

  <!-- header band -->
  <rect x="33" y="35" width="1134" height="60" fill="url(#bandG)"/>
  <text x="110" y="77" text-anchor="middle" fill="#f6edcf" font-size="19" class="sans" font-weight="700" letter-spacing="2">LPD</text>
  <text x="1090" y="77" text-anchor="middle" fill="#f6edcf" font-size="19" class="sans" font-weight="700" letter-spacing="2">LPD</text>
  <text x="600" y="77" text-anchor="middle" fill="#f6edcf" font-size="38" letter-spacing="3"
        textLength="740" lengthAdjust="spacingAndGlyphs">LEONIDA POLICE DEPARTMENT</text>

  <!-- WANTED headline -->
  <text x="600" y="214" text-anchor="middle" fill="url(#redG)" stroke="#5e0707" stroke-width="2"
        font-size="150" textLength="700" lengthAdjust="spacingAndGlyphs">WANTED</text>
  <text x="600" y="243" text-anchor="middle" fill="#1a1510" font-size="18" class="sans" font-weight="700" letter-spacing="8">DEAD OR ALIVE — EXACTLY 13 YEARS LATE</text>

  <!-- six gold stars = maximum GTA wanted level -->
  <g fill="url(#starG)" stroke="#6b4a00" stroke-width="2" stroke-linejoin="round" filter="url(#starShadow)">
    <g transform="translate(387 290)"><path d="M0,-34 L9.99,-11.78 L33,-10.44 L15.5,4.6 L20.6,27.2 L0,16.2 L-20.6,27.2 L-15.5,4.6 L-33,-10.44 L-9.99,-11.78 Z"/></g>
    <g transform="translate(472 290)"><path d="M0,-34 L9.99,-11.78 L33,-10.44 L15.5,4.6 L20.6,27.2 L0,16.2 L-20.6,27.2 L-15.5,4.6 L-33,-10.44 L-9.99,-11.78 Z"/></g>
    <g transform="translate(557 290)"><path d="M0,-34 L9.99,-11.78 L33,-10.44 L15.5,4.6 L20.6,27.2 L0,16.2 L-20.6,27.2 L-15.5,4.6 L-33,-10.44 L-9.99,-11.78 Z"/></g>
    <g transform="translate(642 290)"><path d="M0,-34 L9.99,-11.78 L33,-10.44 L15.5,4.6 L20.6,27.2 L0,16.2 L-20.6,27.2 L-15.5,4.6 L-33,-10.44 L-9.99,-11.78 Z"/></g>
    <g transform="translate(727 290)"><path d="M0,-34 L9.99,-11.78 L33,-10.44 L15.5,4.6 L20.6,27.2 L0,16.2 L-20.6,27.2 L-15.5,4.6 L-33,-10.44 L-9.99,-11.78 Z"/></g>
    <g transform="translate(812 290)"><path d="M0,-34 L9.99,-11.78 L33,-10.44 L15.5,4.6 L20.6,27.2 L0,16.2 L-20.6,27.2 L-15.5,4.6 L-33,-10.44 L-9.99,-11.78 Z"/></g>
  </g>
  <text x="600" y="336" text-anchor="middle" class="sans" fill="#8e0b0b" font-size="15" font-weight="700" letter-spacing="4">SIX-STAR WANTED LEVEL — MAXIMUM</text>

  <!-- mugshot panel -->
  <rect x="40" y="342" width="700" height="166" rx="5" fill="url(#mugG)" stroke="#1c1710" stroke-width="5"/>
  <rect x="46" y="348" width="688" height="154" rx="3" fill="none" stroke="#1c1710" stroke-width="1.2" opacity="0.45"/>
  <g stroke="#1c1710" stroke-width="1.2" opacity="0.5">
    <line x1="41" y1="360" x2="54" y2="360"/>
    <line x1="41" y1="382" x2="50" y2="382"/>
    <line x1="41" y1="404" x2="54" y2="404"/>
    <line x1="41" y1="426" x2="50" y2="426"/>
    <line x1="41" y1="448" x2="54" y2="448"/>
    <line x1="41" y1="470" x2="50" y2="470"/>
  </g>

  <!-- generic silhouettes (inline SVG shapes) -->
  <g fill="#221c13">
    <g transform="translate(200 404) scale(0.86)">
      <circle cx="0" cy="-2" r="36"/>
      <path d="M-34 -6 q-6 -42 18 -50 q16 -6 24 4 q-18 4 -18 24 q0 10 6 16 q-8 12 -30 10 Z"/>
      <path d="M-13 33 h26 v22 q-6 9 -13 9 q-7 0 -13 -9 Z"/>
      <path d="M-58 66 q10 -22 46 -24 q36 2 46 24 l-6 58 h-80 Z"/>
    </g>
    <g transform="translate(415 424) scale(0.86)">
      <path d="M-17 -42 q-2 -14 17 -14 q19 0 17 14 l-3 6 h-28 Z"/>
      <path d="M-17 -36 q-8 4 -8 14 h50 q0 -10 -8 -14 Z"/>
      <path d="M-14 8 h28 v22 q-6 8 -14 8 q-8 0 -14 -8 Z"/>
      <path d="M-46 42 q10 -18 46 -20 q36 2 46 20 l-4 36 h-84 Z"/>
    </g>
  </g>
  <rect x="70" y="472" width="330" height="28" fill="#1c1710"/>
  <text x="235" y="493" text-anchor="middle" fill="#f6edcf" font-size="19" class="sans" font-weight="700" letter-spacing="2">LPD MUGSHOT — CASE VI-16</text>

  <!-- huge VI watermark -->
  <text x="576" y="470" text-anchor="middle" fill="#8e0b0b" opacity="0.22" stroke="#8e0b0b" stroke-width="2"
        font-size="150" letter-spacing="6">VI</text>

  <!-- charges -->
  <text x="600" y="564" text-anchor="middle" fill="#1a1510" font-size="23" class="sans" font-weight="700">
    LAST SEEN: LOS SANTOS, 2013 · CHARGE: MAKING FANS WAIT 13 YEARS
  </text>

  <!-- make.fun ghost -->
  <image xlink:href="mark-1024.png" href="mark-1024.png" x="812" y="338" width="196" height="196" preserveAspectRatio="xMidYMid meet"/>

  <!-- reward line -->
  <rect x="32" y="576" width="1136" height="56" fill="#f0d27a" opacity="0.55"/>
  <line x1="32" y1="574" x2="1168" y2="574" stroke="#1c1710" stroke-width="2"/>
  <line x1="32" y1="634" x2="1168" y2="634" stroke="#1c1710" stroke-width="2"/>
  <text x="600" y="615" text-anchor="middle" fill="#8e0b0b" font-size="32" font-weight="700" letter-spacing="1" class="sans">REWARD: $500 - PAID BY MY AI AGENT'S MAKE.FUN BOUNTY</text>
</svg>
</body>
</html>
